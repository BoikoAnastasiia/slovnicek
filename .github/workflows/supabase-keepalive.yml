# Supabase keep-alive
#
# Free-plan projects are paused after 7 days with no requests, and a paused
# project's DNS record disappears — sign-in dies with NXDOMAIN and the only fix
# is a manual restore from the dashboard. This runs a trivial query every 3 days
# so that never happens.
#
# RLS means the unauthenticated request returns an empty array; the point is
# that Postgres served it at all. The publishable key ships in the client bundle
# anyway, so it is not really a secret — it lives in Actions secrets for hygiene.
#
# Setup: repo → Settings → Secrets and variables → Actions → New repository
# secret, name SUPABASE_ANON_KEY, value from Dashboard → Settings → API.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the project
        env:
          SUPABASE_URL: https://moxdublfyvsfokxajska.supabase.co
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is not set — the ping cannot authenticate."
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/words?select=id&limit=1")
          echo "HTTP $code"
          cat /tmp/body
          # 2xx means Postgres answered. Anything else means the project is
          # already paused or the key rotated — fail loudly so the run emails you.
          case "$code" in
            2*) echo "Project is awake." ;;
            *)  echo "::error::Keep-alive failed with HTTP $code"; exit 1 ;;
          esac
